{
  "name": "Validate issue 3913",
  "on": {
    "push": {
      "branches": [
        "validate/3913"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "regressions": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 6,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "run": "node --test Frontend/src/components/shared/chatMessages.test.mjs"
        },
        {
          "run": "npm ci --ignore-scripts",
          "working-directory": "Frontend"
        },
        {
          "run": "npm run build",
          "working-directory": "Frontend"
        }
      ]
    }
  }
}